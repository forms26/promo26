<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROMO 2026 · Elige a tu persona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Limelight&display=swap">
<style>
/* Mismo mundo visual que la página de premios: noche, rojo, oro. */
:root {
  --noche: #0d0709;
  --tarjeta: #170c10;
  --linea: rgba(226, 178, 76, 0.3);
  --alfombra: #a8101d;
  --alfombra-osc: #6f0a13;
  --oro: #e2b24c;
  --oro-claro: #f5dc92;
  --marfil: #f6ecd9;
  --marfil-2: #cdbfa8;
  --tinta: #1a0b0e;
  --f-display: "Limelight", "Poiret One", Georgia, serif;
  --f-cuerpo: "Josefin Sans", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--noche); }
body {
  margin: 0;
  background: var(--noche);
  color: var(--marfil);
  font-family: var(--f-cuerpo);
  font-size: 16px;
  line-height: 1.45;
  padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(56px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.contenedor { max-width: 760px; margin-inline: auto; }
h1, h2 { text-wrap: balance; font-weight: 400; margin: 0; }

/* Marquesina */
.marquesina {
  text-align: center;
  padding: 6px 8px 26px;
  background: radial-gradient(ellipse 70% 90% at 50% 0%, rgba(168, 16, 29, 0.4), transparent 72%);
}
.luces {
  height: 16px;
  background: radial-gradient(circle, var(--oro-claro) 0 3px, rgba(245, 220, 146, 0.28) 4px 6px, transparent 7px) 50% 50% / 26px 16px repeat-x;
  animation: parpadeo 1.6s steps(2, jump-none) infinite;
}
.luces.b { animation-delay: 0.8s; }
@keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.sobre { margin: 20px 0 0; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: var(--oro); }
.marquesina h1 {
  font-family: var(--f-display);
  font-size: clamp(2.5rem, 10vw, 4.4rem);
  line-height: 1.05;
  margin: 10px 0 8px;
  color: var(--oro-claro);
  text-shadow: 0 0 26px rgba(226, 178, 76, 0.4);
}
.sub { margin: 0 0 22px; color: var(--marfil-2); }

/* Entrada de cine */
.zona-cta { text-align: center; padding: 8px 0 30px; }
.boleto {
  position: relative;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: min(300px, 100%);
  padding: 14px 52px 16px;
  border: 0;
  border-radius: 4px;
  background: linear-gradient(180deg, var(--oro-claro), var(--oro));
  color: var(--tinta);
  font: inherit;
  cursor: pointer;
  box-shadow: 0 6px 0 var(--alfombra-osc), 0 14px 34px rgba(168, 16, 29, 0.45);
}
.boleto::before, .boleto::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--noche);
  transform: translateY(-50%);
}
.boleto::before { left: -10px; }
.boleto::after { right: -10px; }
.boleto small { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; }
.boleto strong { font-family: var(--f-display); font-weight: 400; font-size: 1.8rem; letter-spacing: 0.03em; }
.boleto:hover:not([disabled]) { filter: brightness(1.07); }
.boleto:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 3px 0 var(--alfombra-osc); }
.boleto:focus-visible { outline: 3px solid var(--marfil); outline-offset: 5px; }
.boleto[disabled] { opacity: 0.55; cursor: not-allowed; box-shadow: none; }
.nota { max-width: 46ch; margin: 16px auto 0; color: var(--marfil-2); font-size: 0.95rem; }
.aviso { max-width: 60ch; margin: 0 auto 14px; padding: 8px 12px; border: 1px dashed var(--linea); border-radius: 4px; color: var(--marfil-2); font-size: 0.92rem; text-align: center; }

/* Panel sobre la alfombra */
.encabezado-res { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin: 0 0 12px; }
.encabezado-res h2 { font-family: var(--f-display); font-size: 1.5rem; color: var(--oro-claro); }
.contador { margin: 0; color: var(--marfil-2); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.pasarela {
  padding: 18px 12px;
  background: linear-gradient(90deg, var(--alfombra-osc), var(--alfombra) 10%, var(--alfombra) 90%, var(--alfombra-osc));
  border-inline: 3px solid var(--oro);
}
.carta { min-width: 0; padding: 16px 14px 14px; background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 6px; }
.desc { margin: 4px 0 12px; color: var(--marfil-2); font-size: 0.95rem; }
.nombres { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; margin: 0; padding: 0; list-style: none; }
.nombres li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; background: rgba(246, 236, 217, 0.05); border-radius: 4px; }
.nom { min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.etq { flex: none; color: var(--marfil-2); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; }
.nombres li.tomado { background: rgba(226, 178, 76, 0.12); }
.nombres li.tomado .nom { color: var(--marfil-2); text-decoration: line-through; text-decoration-color: rgba(226, 178, 76, 0.6); }
.nombres li.tomado .etq { color: var(--oro); }
.est { width: 22px; height: 22px; flex: none; fill: var(--oro); }

/* Elegir */
.elegir { padding-bottom: 130px; }
.fila-sup { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; }
.enlace { padding: 8px 0; border: 0; background: none; color: var(--oro); font: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.enlace:focus-visible { outline: 3px solid var(--marfil); outline-offset: 3px; }
.paso { margin: 0; text-align: center; color: var(--oro); font-size: 0.78rem; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; }
.elegir h1, .entrada h1 { margin: 10px 0 6px; text-align: center; font-family: var(--f-display); font-size: clamp(1.9rem, 7vw, 2.8rem); line-height: 1.1; color: var(--oro-claro); }
.elegir .desc, .entrada .desc { margin: 0 0 6px; text-align: center; font-size: 1.05rem; }
.anonimo { margin: 0 0 20px; text-align: center; color: var(--marfil-2); font-size: 0.88rem; }
.flash { margin: 0 0 14px; padding: 8px 12px; border-left: 3px solid var(--oro); background: rgba(226, 178, 76, 0.1); font-size: 0.92rem; }
.error { margin: 14px 0 0; padding: 8px 12px; border-left: 3px solid var(--alfombra); background: rgba(168, 16, 29, 0.22); }
.cands { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; border: 0; margin: 0; padding: 0; min-width: 0; }
.cands legend, .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.cand { position: relative; display: block; min-width: 0; }
.cand input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.cand input:disabled { cursor: not-allowed; }
.tarjeta { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 56px; padding: 12px; background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 6px; font-weight: 600; overflow-wrap: anywhere; }
.tarjeta::after { content: "\2605"; color: transparent; }
.cand.no .tarjeta::after { content: attr(data-etq); color: var(--marfil-2); font-size: 0.72rem; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
.cand input:hover:not(:disabled) + .tarjeta { border-color: var(--oro); }
.cand input:checked + .tarjeta { background: linear-gradient(180deg, var(--oro-claro), var(--oro)); border-color: var(--oro-claro); color: var(--tinta); }
.cand input:checked + .tarjeta::after { color: var(--alfombra); }
.cand input:focus-visible + .tarjeta { outline: 3px solid var(--marfil); outline-offset: 2px; }
.cand input:disabled:not(:checked) + .tarjeta { opacity: 0.45; }
.barra {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 5;
  background: rgba(13, 7, 9, 0.95);
  border-top: 2px solid var(--oro);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.barra-in { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 14px; max-width: 760px; margin-inline: auto; }
.eleccion { flex: 1 1 180px; min-width: 0; }
.eleccion small { display: block; color: var(--marfil-2); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; }
.eleccion b { display: block; overflow-wrap: anywhere; }
.btn { padding: 12px 22px; border: 2px solid var(--oro); border-radius: 4px; background: var(--alfombra); color: var(--marfil); font: inherit; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
.btn:hover:not([disabled]) { background: #c0141f; }
.btn:focus-visible { outline: 3px solid var(--marfil); outline-offset: 3px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.final { padding: 40px 0 20px; text-align: center; }
.final .est { width: 64px; height: 64px; margin-bottom: 8px; }
.final h1 { font-family: var(--f-display); font-size: clamp(2rem, 8vw, 3rem); color: var(--oro-claro); margin-bottom: 10px; }
.final .elegido { margin: 0 auto 14px; font-family: var(--f-display); font-size: clamp(1.5rem, 6vw, 2.2rem); color: var(--marfil); overflow-wrap: anywhere; }
.final p { max-width: 44ch; margin: 0 auto 26px; color: var(--marfil-2); }

/* Código personal */
.entrada { padding: 10px 0 30px; text-align: center; }
.codigo-form { display: grid; justify-items: center; gap: 22px; margin-top: 18px; }
#codigo {
  width: min(320px, 100%);
  padding: 12px 14px;
  background: var(--tarjeta);
  border: 2px solid var(--oro);
  border-radius: 4px;
  color: var(--marfil);
  font: 700 1.7rem var(--f-cuerpo);
  letter-spacing: 0.3em;
  text-align: center;
  text-transform: uppercase;
}
#codigo:focus-visible { outline: 3px solid var(--marfil); outline-offset: 3px; }

@media (min-width: 640px) { .pasarela { padding: 22px; } .carta { padding: 18px 18px 16px; } }
@media (prefers-reduced-motion: reduce) { .luces { animation: none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="estrella" viewBox="0 0 24 24"><path d="M12 2.2l2.9 6.5 7.1.7-5.3 4.8 1.5 7-6.2-3.6-6.2 3.6 1.5-7L2 9.4l7.1-.7z"/></symbol>
</svg>
<main class="contenedor" id="app"></main>

<script>
(function () {
  'use strict';

  // Pega aquí la URL de tu aplicación web de Apps Script (la que termina en /exec).
  // Si la dejas vacía, la página funciona en modo de prueba: todo se guarda solo en este navegador
  // y el código de cada persona es su número: A01, A02, ... A26 (en el orden de la lista NOMBRES).
  var API_URL = 'https://script.google.com/macros/s/AKfycbxbTj1Dal_o00HPXkHHGeGrJuMsG0t950s1n_UQ5e-zr9LTYiPKJ-5f3dD4tDrjkDbrIA/exec';

  var DEMO = !API_URL;
  var CLAVE = 'elegir_codigo';
  var CLAVE_DEMO = 'elegir_demo';

  // El orden debe ser igual al de NOMBRES en CodeElegir.gs (los ids son a01, a02, ...).
  var NOMBRES = [
    'Marissa Rivas', 'Ana Hernandez', 'Angiely Quintanilla', 'Arellys Ramos', 'Aylin Antunez',
    'Aimar Aguilar', 'Kimberly Claros', 'Ledis Guifarro', 'Liz Ruiz', 'Nahomy Servellon',
    'Nicol Lopez', 'Silvia Sanchez', 'Stacy Guerrero', 'Stephanie Pineda', 'Tateri Perdomo',
    'Yenifer Mendez', 'Cristopher Bejarano', 'Fernanddo Croasdaile', 'Hector Arias', 'Jose Hernandez',
    'Kaletf Aguilera', 'Kenneth Hernandez', 'Maikol Catellanos', 'Osvaldo Cerrato',
    'Ulbrecth Croasdaile', 'Yefri Carrillos'
  ];
  var ALUMNOS = NOMBRES.map(function (n, i) { return { id: 'a' + (i < 9 ? '0' : '') + (i + 1), n: n }; });
  var POR_ID = {};
  ALUMNOS.forEach(function (a) { POR_ID[a.id] = a; });
  var ORDEN = ALUMNOS.slice().sort(function (a, b) { return a.n.localeCompare(b.n, 'es'); });

  var app = document.getElementById('app');
  var st = {
    codigo: '', yo: '', elegido: '', listo: false,
    tomados: {}, live: false, fallo: false,
    sel: '', saving: false, error: '', flash: ''
  };

  // ---------- utilidades ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function leer(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function guardar(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } }
  function borrar(k) { try { localStorage.removeItem(k); } catch (e) { /* sin almacenamiento */ } }
  function vista() { return location.hash === '#elegir' ? 'elegir' : 'inicio'; }
  function limpiarCodigo(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  function esAlumno(id) { return Object.prototype.hasOwnProperty.call(POR_ID, id); }
  function estrella() { return '<svg class="est" viewBox="0 0 24 24" aria-hidden="true"><use href="#estrella"/></svg>'; }
  function nTomados() { return Object.keys(st.tomados).length; }
  function firma(m) { return Object.keys(m).sort().join(','); }
  function aMapa(lista) {
    var m = {};
    (lista || []).forEach(function (id) { if (esAlumno(id)) m[id] = true; });
    return m;
  }

  // ---------- conexión (Apps Script o modo de prueba) ----------
  function demoDatos() {
    var d;
    try { d = JSON.parse(leer(CLAVE_DEMO) || '{}'); } catch (e) { d = {}; }
    d.pares = d.pares || {}; // quien -> elegido
    return d;
  }
  function llamar(body) {
    if (!DEMO) {
      return fetch(API_URL, { method: 'POST', body: JSON.stringify(body) }).then(function (r) { return r.json(); });
    }
    return new Promise(function (resolve) {
      var d = demoDatos();
      var yo = String(body.codigo || '').toLowerCase();
      if (!esAlumno(yo)) return resolve({ ok: false, error: 'codigo_invalido' });
      var mio = d.pares[yo] || '';
      var tomados = Object.keys(d.pares).map(function (k) { return d.pares[k]; });
      if (body.action === 'estado') return resolve({ ok: true, yo: yo, elegido: mio, tomados: tomados });
      if (mio) return resolve({ ok: false, error: 'ya_eligio', elegido: mio, tomados: tomados });
      var x = String(body.elegido);
      if (!esAlumno(x)) return resolve({ ok: false, error: 'invalido' });
      if (x === yo) return resolve({ ok: false, error: 'a_si_mismo' });
      if (tomados.indexOf(x) >= 0) return resolve({ ok: false, error: 'no_disponible', tomados: tomados });
      var quedanQuienes = ALUMNOS.filter(function (a) { return !d.pares[a.id] && a.id !== yo; });
      var quedanA = ALUMNOS.filter(function (a) { return tomados.indexOf(a.id) < 0 && a.id !== x; });
      if (quedanQuienes.length === 1 && quedanA.length === 1 && quedanQuienes[0].id === quedanA[0].id) {
        return resolve({ ok: false, error: 'bloqueo', tomados: tomados });
      }
      d.pares[yo] = x;
      guardar(CLAVE_DEMO, JSON.stringify(d));
      tomados.push(x);
      resolve({ ok: true, elegido: x, tomados: tomados });
    });
  }
  function leerTomados() {
    if (!DEMO) return fetch(API_URL + '?t=' + Date.now()).then(function (r) { return r.json(); });
    var d = demoDatos();
    return Promise.resolve({ ok: true, tomados: Object.keys(d.pares).map(function (k) { return d.pares[k]; }) });
  }
  function aplicarTomados(lista) {
    var nuevo = aMapa(lista), cambio = firma(nuevo) !== firma(st.tomados);
    st.tomados = nuevo;
    if (st.sel && nuevo[st.sel]) { st.sel = ''; st.flash = 'Esa persona acaba de ser elegida por alguien más. Elige a otra.'; }
    return cambio;
  }
  function refrescar() {
    leerTomados().then(function (r) {
      if (!r || !r.ok) throw new Error('respuesta');
      var cambio = aplicarTomados(r.tomados);
      var primera = !st.live;
      st.live = true; st.fallo = false;
      if ((cambio || primera) && !st.saving) render();
    }).catch(function () {
      if (!st.live) { st.fallo = true; if (vista() === 'inicio') render(); }
    });
  }

  // ---------- inicio ----------
  function avisoPrueba() {
    return DEMO ? '<p class="aviso">Modo de prueba: todo se guarda solo en este navegador. Tu código es A01 a A' + ALUMNOS.length + '.</p>' : '';
  }

  function inicioHTML() {
    var small = 'Entrada general', strong = 'Ir a elegir', dis = false, nota = '';
    if (st.codigo && st.listo && st.elegido) {
      dis = true; small = 'Gracias'; strong = '¡Ya elegiste!';
      nota = 'Tu elección quedó guardada y es secreta.';
    } else if (!st.codigo) {
      nota = 'Para elegir necesitas tu código personal.';
    }
    var aviso = st.fallo ? '<p class="aviso">No se pudo cargar la lista todavía. Intentaremos de nuevo en unos segundos.</p>' : '';
    var lista = ORDEN.map(function (a) {
      var t = st.tomados[a.id];
      return '<li class="' + (t ? 'tomado' : '') + '"><span class="nom">' + esc(a.n) + '</span><span class="etq">' + (t ? 'Elegido/a' : 'Disponible') + '</span></li>';
    }).join('');
    return '<header class="marquesina"><div class="luces"></div>' +
      '<p class="sobre">Estreno · Una noche para recordar</p>' +
      '<h1>PROMO 2026</h1>' +
      '<p class="sub">Elige a tu persona · ' + ALUMNOS.length + ' compañeros</p>' +
      '<div class="luces b"></div></header>' +
      avisoPrueba() +
      '<div class="zona-cta"><button class="boleto" data-ir type="button"' + (dis ? ' disabled' : '') + '><small>' + small + '</small><strong>' + strong + '</strong></button>' +
      (nota ? '<p class="nota">' + esc(nota) + '</p>' : '') + '</div>' +
      aviso +
      '<div class="encabezado-res"><h2>¿Quién sigue disponible?</h2><p class="contador">' + nTomados() + ' de ' + ALUMNOS.length + ' elegidos</p></div>' +
      '<section class="pasarela" aria-label="Estado de los compañeros"><div class="carta">' +
      '<p class="desc">Cada persona solo puede ser elegida una vez. Aquí no se muestra quién eligió a quién.</p>' +
      '<ul class="nombres">' + lista + '</ul></div></section>';
  }

  // ---------- elegir ----------
  function volverBtn() { return '<button class="enlace" type="button" data-inicio>← Volver al inicio</button>'; }
  function salirBtn() { return '<button class="enlace" type="button" data-salir>Cambiar de código</button>'; }

  function entradaHTML() {
    return '<div class="elegir"><div class="fila-sup">' + volverBtn() + '</div>' +
      '<section class="entrada"><p class="paso">Entrada general</p><h1>Tu código</h1>' +
      '<p class="desc">Escribe el código personal que te dieron.</p>' + avisoPrueba() +
      '<form class="codigo-form" id="form-codigo" autocomplete="off">' +
      '<label class="sr" for="codigo">Código personal</label>' +
      '<input id="codigo" type="text" inputmode="text" maxlength="12" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="A1B2C">' +
      '<button class="boleto" id="btn-entrar" type="submit"><small>Presenta tu entrada</small><strong>Entrar</strong></button>' +
      '</form><p class="error" id="error-codigo" role="alert" hidden></p></section></div>';
  }

  function elegirHTML() {
    if (!st.codigo) return entradaHTML();
    if (!st.listo) return '<div class="elegir"><div class="fila-sup">' + volverBtn() + '</div><p class="aviso">Cargando tu boleta…</p></div>';
    if (st.elegido) {
      return '<section class="final">' + estrella() +
        '<h1>¡Elección hecha!</h1>' +
        '<p class="elegido">' + esc(POR_ID[st.elegido].n) + '</p>' +
        '<p>Esta es tu persona. Solo tú puedes ver esto: nadie más sabe a quién elegiste y no se puede cambiar.</p>' +
        '<button class="boleto" type="button" data-inicio><small>Volver</small><strong>Ir al inicio</strong></button>' +
        '<p>' + salirBtn() + '</p></section>';
    }
    var cands = ORDEN.map(function (a) {
      var tu = a.id === st.yo, tom = !!st.tomados[a.id], no = tu || tom;
      return '<label class="cand' + (no ? ' no' : '') + '"><input type="radio" name="eleccion" value="' + a.id + '"' +
        (st.sel === a.id ? ' checked' : '') + (no || st.saving ? ' disabled' : '') +
        '><span class="tarjeta"' + (no ? ' data-etq="' + (tu ? 'Tú' : 'Elegido/a') + '"' : '') + '>' + esc(a.n) + '</span></label>';
    }).join('');
    return '<div class="elegir"><div class="fila-sup">' + volverBtn() + salirBtn() + '</div>' +
      '<p class="paso">Hola, ' + esc(POR_ID[st.yo].n) + '</p>' +
      '<h1>Elige a tu persona</h1>' +
      '<p class="desc">Escoge a un compañero del salón. Solo se puede elegir una vez a cada uno.</p>' +
      '<p class="anonimo">Elección secreta: nadie ve quién eligió a quién. No se puede cambiar.</p>' +
      (st.flash ? '<p class="flash" role="status">' + esc(st.flash) + '</p>' : '') +
      '<fieldset class="cands"><legend>Elige a un compañero</legend>' + cands + '</fieldset>' +
      '<p class="error" id="error" role="alert"' + (st.error ? '' : ' hidden') + '>' + esc(st.error) + '</p>' +
      '<div class="barra"><div class="barra-in"><div class="eleccion"><small>Tu elección</small><b id="eleccion"></b></div>' +
      '<button class="btn" type="button" id="confirmar" data-confirmar></button></div></div></div>';
  }

  function actualizarBarra() {
    var e = document.getElementById('eleccion'), b = document.getElementById('confirmar'), er = document.getElementById('error');
    if (!e || !b) return;
    e.textContent = st.sel ? POR_ID[st.sel].n : 'Elige a un compañero';
    b.textContent = st.saving ? 'Registrando…' : 'Confirmar elección';
    b.disabled = !st.sel || st.saving;
    if (er) { er.textContent = st.error; er.hidden = !st.error; }
  }

  function render() {
    app.innerHTML = vista() === 'elegir' ? elegirHTML() : inicioHTML();
    actualizarBarra();
  }

  function olvidarCodigo() {
    st.codigo = ''; st.yo = ''; st.elegido = ''; st.sel = ''; st.error = ''; st.flash = ''; st.listo = true;
    borrar(CLAVE);
  }

  function entrar() {
    var inp = document.getElementById('codigo');
    var err = document.getElementById('error-codigo');
    var btn = document.getElementById('btn-entrar');
    var cod = limpiarCodigo(inp.value);
    function mostrar(t) { err.textContent = t; err.hidden = false; }
    if (!cod) { mostrar('Escribe tu código.'); return; }
    btn.disabled = true; err.hidden = true;
    llamar({ action: 'estado', codigo: cod }).then(function (r) {
      if (r && r.ok && esAlumno(r.yo)) {
        st.codigo = cod; guardar(CLAVE, cod);
        st.yo = r.yo; st.elegido = esAlumno(r.elegido) ? r.elegido : '';
        if (r.tomados) aplicarTomados(r.tomados);
        st.listo = true; st.sel = ''; st.flash = ''; st.error = '';
        render(); window.scrollTo(0, 0);
      } else {
        btn.disabled = false;
        mostrar(r && r.error === 'codigo_invalido' ? 'Ese código no existe. Revisa que esté bien escrito.' : 'No se pudo comprobar el código. Inténtalo otra vez.');
      }
    }).catch(function () {
      btn.disabled = false;
      mostrar('No se pudo conectar. Revisa tu internet e inténtalo otra vez.');
    });
  }

  async function confirmar() {
    if (st.saving || !st.sel || !st.codigo || st.elegido) return;
    var nombre = POR_ID[st.sel].n;
    if (!window.confirm('¿Elegir a ' + nombre + '?\n\nNo podrás cambiar tu elección.')) return;
    st.saving = true; st.error = ''; st.flash = '';
    render();
    try {
      var r = await llamar({ action: 'elegir', codigo: st.codigo, elegido: st.sel });
      if (r && r.tomados) aplicarTomados(r.tomados);
      if (r && r.ok) {
        st.elegido = r.elegido; st.sel = '';
        refrescar();
      } else if (r && r.error === 'ya_eligio') {
        st.elegido = esAlumno(r.elegido) ? r.elegido : st.elegido; st.sel = '';
      } else if (r && r.error === 'no_disponible') {
        st.sel = '';
        st.error = 'Alguien ya eligió a esa persona. Elige a otra.';
      } else if (r && r.error === 'a_si_mismo') {
        st.sel = '';
        st.error = 'No puedes elegirte a ti mismo.';
      } else if (r && r.error === 'bloqueo') {
        st.sel = '';
        st.error = 'Con esa elección, la última persona en elegir se quedaría sin opciones. Elige a otra.';
      } else if (r && r.error === 'codigo_invalido') {
        olvidarCodigo();
      } else if (r && r.error === 'ocupado') {
        st.error = 'Hay muchas personas eligiendo al mismo tiempo. Inténtalo otra vez en un momento.';
      } else {
        st.error = 'No se pudo registrar tu elección. Inténtalo otra vez.';
      }
    } catch (e) {
      st.error = 'No se pudo registrar tu elección. Revisa tu conexión e inténtalo otra vez.';
    }
    st.saving = false;
    render();
    window.scrollTo(0, 0);
  }

  // ---------- eventos ----------
  app.addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (!t || t.disabled) return;
    if (t.hasAttribute('data-ir')) { location.hash = 'elegir'; }
    else if (t.hasAttribute('data-inicio')) { location.hash = 'inicio'; }
    else if (t.hasAttribute('data-salir')) { olvidarCodigo(); render(); window.scrollTo(0, 0); }
    else if (t.hasAttribute('data-confirmar')) { confirmar(); }
  });
  app.addEventListener('change', function (e) {
    var t = e.target;
    if (!t || t.name !== 'eleccion') return;
    st.sel = t.value; st.error = '';
    actualizarBarra();
  });
  app.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target && e.target.id === 'form-codigo') entrar();
  });
  window.addEventListener('hashchange', function () { render(); window.scrollTo(0, 0); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refrescar(); });
  setInterval(function () { if (!document.hidden) refrescar(); }, 15000);

  // ---------- arranque ----------
  st.codigo = limpiarCodigo(leer(CLAVE));
  st.listo = !st.codigo;
  render();
  refrescar();
  if (st.codigo) {
    llamar({ action: 'estado', codigo: st.codigo }).then(function (r) {
      if (r && r.ok && esAlumno(r.yo)) {
        st.yo = r.yo; st.elegido = esAlumno(r.elegido) ? r.elegido : '';
        if (r.tomados) aplicarTomados(r.tomados);
      } else if (r && r.error === 'codigo_invalido') { olvidarCodigo(); }
    }).catch(function () { /* sin conexión: se vuelve a comprobar al entrar */ }).then(function () {
      if (st.codigo && !st.yo) olvidarCodigo();
      st.listo = true;
      render();
    });
  }
})();
</script>
</body>
</html>
